<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nordic Toolbox</title>
<meta name="description" content="Educational calculators and interpretation aids for healthcare professionals.">
<meta name="theme-color" content="#007ea2">
<link rel="icon" href="assets/nordic-logo.png" type="image/png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap">
<style>
:root{--blue:#007ea2;--orange:#f89c53;--bg:#f4f7f8;--surface:#fff;--fg:#0d0d0d;--muted:#5a6266;--line:#d9e2e6}
@media (prefers-color-scheme:dark){:root{--blue:#3fb0d0;--bg:#0f1416;--surface:#182024;--fg:#f2f4f5;--muted:#a3adb2;--line:#2b373c;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Open Sans",Arial,sans-serif;line-height:1.55}
.in{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:#007ea2;color:#fff}
header .in{display:flex;align-items:center;gap:18px;padding-block:28px}
header img{width:84px;height:84px}
h1{font-family:Montserrat,Arial,sans-serif;margin:0;font-size:clamp(24px,4vw,32px)}
header p{margin:4px 0 0;color:#e3f1f6}
main{padding-block:26px 40px;display:grid;gap:14px}
a.tool{display:grid;gap:4px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--blue);border-radius:10px;padding:16px 18px;color:inherit;text-decoration:none}
a.tool:hover,a.tool:focus-visible{border-left-color:var(--orange)}
a.tool strong{font-family:Montserrat,Arial,sans-serif;font-size:17px}
a.tool span{color:var(--muted);font-size:14px}
footer{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:10px}
</style>
</head>
<body>
<header><div class="in"><img src="assets/nordic-logo.png" alt="Nordic Laboratories"><div><h1>Nordic Toolbox</h1><p>Practitioner tools for healthcare professionals</p></div></div></header>
<main class="in">
  <a class="tool" href="hcy-mma/"><strong>MMA × Homocysteine Interpreter</strong><span>Interpret MMA and Hcy patterns: likely cause, diagnostic priority, first-line micronutrients.</span></a>
  <footer>Educational tools for trained healthcare professionals. Not a substitute for clinical judgement.</footer>
</main>
</body>
</html>
